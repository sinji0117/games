# nginx / Rpanel 리버스 프록시 예시. games.example.com 과 인증서 경로를 바꿔 쓰세요.
# 앱 컨테이너는 127.0.0.1:8080 에서 API 와 프론트엔드를 함께 서빙합니다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name games.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name games.example.com;

    ssl_certificate     /etc/letsencrypt/live/games.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.example.com/privkey.pem;

    client_max_body_size 1m;

    # 실시간 알림 WebSocket — 업그레이드 헤더 전달, 오래 열려 있도록
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # TRUST_PROXY=true 일 때 레이트 리밋이 이 값을 씀 — 클라이언트가 보낸 값을 덮어쓰도록 $remote_addr 로
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
