# 로컬 개발용 MariaDB + Redis. 실행: docker compose up -d
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: games
      MARIADB_USER: games
      MARIADB_PASSWORD: games
      MARIADB_ROOT_PASSWORD: games-root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  mariadb-data:
  redis-data:
