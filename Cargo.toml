[workspace]
resolver = "2"
members = ["crates/core", "crates/api"]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "MIT"
authors = ["sinji0117"]
repository = "https://github.com/sinji0117/games"
publish = false

[workspace.dependencies]
game-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "macros", "migrate"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
argon2 = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
