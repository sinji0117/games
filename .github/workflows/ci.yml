name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        # --locked: 의존성을 바꾸고 Cargo.lock 을 안 올리면 여기서 실패 (아래 LOCKFILE 줄에서 새 잠금 파일을 꺼낼 수 있음)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --workspace
      - name: 핀볼·빙고·사다리 기준값이 최신인지
        run: |
          cargo run -q -p game-core --example ladder_fixtures | cmp - apps/site/src/lib/ladder/tests/rust-fixtures.json
          cargo run -q -p game-core --example bingo_fixtures | cmp - apps/site/src/lib/bingo/tests/rust-fixtures.json
          cargo run -q -p game-core --example pinball_fixtures | cmp - apps/site/src/lib/pinball/tests/rust-fixtures.json
      - name: Cargo.lock 출력 (로그에서 꺼내 커밋하기 위함)
        if: always()
        run: |
          cargo metadata --format-version 1 > /dev/null   # 빠진 의존성만 최소로 잠금 파일에 추가
          echo "LOCKFILE cargo $(gzip -9c Cargo.lock | base64 -w0)"

  web:
    name: Web (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: typecheck
        run: pnpm -r typecheck
      - name: test
        run: pnpm -r test
      - name: build
        run: pnpm --filter @games/site build
      - name: pnpm-lock.yaml 출력 (로그에서 꺼내 커밋하기 위함)
        run: echo "LOCKFILE pnpm $(gzip -9c pnpm-lock.yaml | base64 -w0)"

  release:
    name: Rpanel 빌드 스크립트 · 실행 확인
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rpanel 과 같은 방식으로 빌드 (작업 폴더 …/apps/<slug>/repo 흉내)
        run: |
          mkdir -p "$RUNNER_TEMP/apps/games-ci"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/apps/games-ci/repo"
          cd "$RUNNER_TEMP/apps/games-ci/repo"
          bash scripts/build-release.sh
          ls -l target/release/game-api target/release/games target/release/games-ci
      - name: PORT 만 주고 실행해서 화면 · API 확인
        run: |
          PORT=4100 ./target/release/game-api > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4100/api/health > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4100/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:4100/api/health/deps | tee /dev/stderr | grep -q '"db":false'
          curl -fsS http://127.0.0.1:4100/ | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:4100/ | grep -qi 'cache-control: no-cache'
          asset=$(curl -fsS http://127.0.0.1:4100/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://127.0.0.1:4100$asset" | grep -qi 'immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4100/api/nope)" = 404
          # 루프백에만 열렸는지
          ! curl -fsS --max-time 2 "http://$(hostname -I | awk '{print $1}'):4100/api/health" > /dev/null 2>&1
          cat server.log

  docker:
    name: Docker 이미지 빌드
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: games:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
